<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="F1 News">
<meta name="theme-color" content="#1d1f23">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>F1 News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1d1f23; --card:#26292e; --card2:#2f3238; --line:#383c43;
    --text:#f1eee8; --muted:#a2a6ad; --faint:#6d7279;
    --red:#e8002d; --red2:#ff4d63; --tint:rgba(232,0,45,.14);
    --gold:#f2c14e; --silver:#cfd3d8; --bronze:#d4915a;
    --f:"Titillium Web",system-ui,sans-serif;
    --nav:64px;
  }
  body.f2{--red:#2f74ff;--red2:#7aa6ff;--tint:rgba(47,116,255,.16)}
  body.wec{--red:#13b07b;--red2:#5fd9ad;--tint:rgba(19,176,123,.16)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  body{padding:0 env(safe-area-inset-right) calc(var(--nav) + env(safe-area-inset-bottom) + 8px) env(safe-area-inset-left)}
  button{font-family:var(--f)}
  :focus-visible{outline:2px solid var(--red2);outline-offset:2px}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 24px}

  /* testata: cordolo bianco-colore in cima */
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin:0 -16px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(29,31,35,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
  header:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:repeating-linear-gradient(90deg,var(--red) 0 18px,#f1eee8 18px 36px);opacity:.9}
  .serie{position:relative;display:inline-flex;align-items:center;cursor:pointer}
  .logo{display:inline-flex;align-items:baseline;gap:6px;font-weight:900;font-style:italic;font-size:28px;line-height:1;letter-spacing:-.5px}
  .logo b{color:var(--red);font-weight:900}
  .logo > span{display:none}
  .serie .logo i{font-style:normal;font-weight:600;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;align-self:center;margin-left:2px}
  .serie select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px;cursor:pointer}
  .hright{display:flex;align-items:center;gap:10px}
  .stamp{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.2;white-space:nowrap}
  .refresh{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .refresh:active{background:var(--card2)}
  .refresh svg{width:18px;height:18px}
  .refresh.spin svg{animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* hero: semaforo di partenza */
  .hero{position:relative;margin:14px 0 18px;padding:18px 18px 16px;border-radius:22px;background:var(--card);overflow:hidden}
  .hero:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--red)}
  .hero .lbl{font-size:14px;font-weight:600;color:var(--red2)}
  .hero .gp{font-weight:900;font-style:italic;font-size:clamp(32px,9vw,44px);line-height:.98;letter-spacing:-1px;margin:4px 0 6px}
  .hero .when{color:var(--muted);font-size:15px;line-height:1.35}
  .lights{display:flex;gap:8px;margin:18px 0 10px;padding:10px 12px;background:#141518;border-radius:14px;width:max-content;max-width:100%}
  .lights i{width:30px;height:30px;border-radius:50%;background:#2c2f34;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);display:block;transition:background .5s,box-shadow .5s}
  .lights i.on{background:radial-gradient(circle at 40% 35%,#ff6a6a,#e10600 60%,#8a0400);box-shadow:0 0 14px rgba(255,30,30,.55)}
  .lights.go i{background:radial-gradient(circle at 40% 35%,#9dffb4,#19c54a 60%,#0a6b25);box-shadow:0 0 14px rgba(40,220,90,.5)}
  .cd{font-size:16px;color:var(--text);line-height:1.4}
  .cd b{font-weight:700}
  .cd small{color:var(--muted);font-size:14px}

  /* barra di navigazione in basso */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
    padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
    background:rgba(29,31,35,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .tabs button{flex:1;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--faint);font-size:10.5px;font-weight:600;padding:6px 0 4px;min-width:0;white-space:nowrap;border-radius:12px;cursor:pointer}
  .tabs button svg{width:24px;height:24px}
  .tabs button.on{color:var(--text)}
  .tabs button.on svg{color:var(--red)}

  /* notizie */
  .pages{margin:0 0 14px}
  .pages h4{margin:0 2px 8px;font-size:14px;color:var(--muted);font-weight:600}
  .pages .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pg{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);background:var(--card);border-radius:16px;padding:10px 12px}
  .pg:active{background:var(--card2)}
  .pg .av{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-style:italic;font-size:15px;color:#fff}
  .pg b{display:block;font-size:15px;font-weight:700;line-height:1.1}
  .pg small{font-size:12.5px;color:var(--muted)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font:600 14px var(--f);cursor:pointer}
  .chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
  .day{font-size:14px;color:var(--muted);margin:20px 2px 6px;font-weight:600}
  .day:first-letter{text-transform:uppercase}
  #list{background:var(--card);border-radius:20px;padding:0 16px;overflow:hidden}
  #list:empty,#list:has(.empty){background:transparent}
  #list .day{margin:0 -16px;padding:14px 16px 4px;background:var(--bg)}
  #list .day:first-child{padding-top:4px}
  .card{display:block;text-decoration:none;color:inherit;padding:14px 0;border-top:1px solid var(--line)}
  .day + .card{border-top:0}
  .card:active{opacity:.7}
  .card.top h3{font-size:21px;font-weight:700;line-height:1.18}
  .card.top{position:relative;padding-left:14px}
  .card.top:before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:2px;background:var(--red)}
  .meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px;flex-wrap:wrap}
  .tag{color:var(--red2);font-weight:700;font-size:13px}
  .card h3{margin:0 0 4px;font-size:17.5px;line-height:1.28;font-weight:600}
  .card p{margin:0;color:#c8c5bf;font-size:15px;line-height:1.5}
  .src{margin-top:6px;font-size:13px;color:var(--muted);font-weight:600}
  .empty{color:var(--muted);text-align:center;padding:40px 10px;line-height:1.6;font-size:15px}
  .btn{display:inline-block;margin-top:10px;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 16px;font:600 14px var(--f);cursor:pointer}
  .skel{height:92px;border-radius:14px;background:linear-gradient(90deg,#26292e,#2f3238,#26292e);background-size:200% 100%;animation:sh 1.2s infinite;margin:12px 0}
  @keyframes sh{to{background-position:-200% 0}}

  /* orari */
  .tv8{background:linear-gradient(135deg,rgba(143,123,255,.18),var(--card) 70%);border-radius:20px;padding:14px 16px;margin-bottom:12px}
  .tv8 h4{margin:0 0 6px;font-size:15px;color:#b9abff;font-weight:700}
  .tv8 .l{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:16px}
  .tv8 .l b{font-weight:700;font-size:20px}
  .tv8 .note{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
  .sess{display:flex;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
  .sess:last-child{border-bottom:0}
  .sess .t{min-width:56px;font-weight:700;font-size:21px;line-height:1.1}
  .sess .t small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
  .sess .n{flex:1}
  .sess .n b{display:block;font-size:16px;font-weight:700}
  .sess.key .t{color:var(--red2)}
  .sess .ch{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.5}
  .sess .ch .p8{color:#b9abff;font-weight:600}
  .sess.done{opacity:.42}
  .badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px}
  .badge.live{background:var(--red);color:#fff}.badge.next{background:var(--tint);color:var(--red2)}
  .dayh{font-size:14px;color:var(--muted);padding:12px 16px 6px;font-weight:600}
  .dayh:first-letter{text-transform:uppercase}

  /* tabelle */
  .table{background:var(--card);border-radius:20px;overflow:hidden}
  .sub{font-size:13px;color:var(--muted);padding:12px 16px 8px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
  .sub + .row,.sbanner + .sub + .row{border-top:0}
  .pos{width:28px;font-weight:900;font-style:italic;font-size:21px;text-align:center;color:var(--faint)}
  .row.p1 .pos{color:var(--gold)}.row.p2 .pos{color:var(--silver)}.row.p3 .pos{color:var(--bronze)}
  .bar{width:4px;height:32px;border-radius:2px;flex:0 0 auto}
  .who{flex:1;min-width:0}
  .who b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who small{color:var(--muted);font-size:13px}
  .pts{font-weight:700;font-size:20px;text-align:right;min-width:52px}
  .pts small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
  .champ{font-size:11px;background:var(--gold);color:#1d1f23;border-radius:999px;padding:1px 7px;margin-left:6px;font-weight:700;vertical-align:2px}
  .row .note{font-size:12px;color:var(--red2);margin-left:6px;font-weight:600}
  .seg{display:flex;gap:4px;margin-bottom:12px;background:var(--card);border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font:700 14px var(--f);padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .seg button.on{color:#fff;background:var(--red)}

  /* risultati e calendario */
  .rhead{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
  .rhead .lbl{font-size:14px;color:var(--red2);font-weight:600}
  .rhead h3{font-weight:900;font-style:italic;font-size:30px;line-height:1;letter-spacing:-.5px;margin:4px 0 8px}
  .rhead p{margin:0;color:#c8c5bf;font-size:15px;line-height:1.55}
  .podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:6px;margin:14px 0 4px}
  .podium div{background:var(--card2);border-radius:12px 12px 4px 4px;padding:10px 6px 8px;text-align:center}
  .podium div:nth-child(1){min-height:84px}.podium div:nth-child(2){min-height:104px;background:linear-gradient(180deg,rgba(242,193,78,.22),var(--card2))}.podium div:nth-child(3){min-height:72px}
  .podium b{display:block;font-size:22px}
  .podium span{font-size:15px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spoilwrap.spoil .rhead p,.spoilwrap.spoil .podium,.spoilwrap.spoil .table .row{filter:blur(7px);pointer-events:none;user-select:none}
  .cal .row.next{background:var(--tint)}
  .cal .rnd{width:30px;font-weight:900;font-style:italic;font-size:16px;color:var(--faint);text-align:center}
  .cal .dt{text-align:right;font-size:13px;color:var(--muted);min-width:64px}
  .cal .dt b{display:block;color:var(--text);font-size:15px}
  .cal .win{font-size:13px;color:var(--muted);line-height:1.4}
  .cal .win i{font-style:normal}
  .cal .done .who b{color:#d9d6d0;font-weight:600}

  /* spoiler e modale */
  .card.spoil{position:relative;pointer-events:none}
  .card.spoil h3,.card.spoil p,.card.spoil .src{filter:blur(7px);user-select:none}
  .table.spoil .row{filter:blur(6px)}
  .sbanner{display:flex;align-items:center;gap:10px;background:var(--tint);border-radius:16px;padding:10px 12px;margin:0 0 12px;font-size:14px;line-height:1.4}
  #list .sbanner{margin:12px 0}
  .sbanner span{flex:1}
  .sbanner button{background:var(--red);color:#fff;border:0;border-radius:999px;padding:8px 12px;font:700 13px var(--f);cursor:pointer;white-space:nowrap}
  .modal{position:fixed;inset:0;background:rgba(10,11,13,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .modal[hidden]{display:none}
  .mbox{background:var(--card);border-radius:26px;padding:22px 20px 16px;max-width:420px;width:100%;text-align:center;animation:up .3s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:0}}
  .mbox .ico{font-size:40px;margin-bottom:4px}
  .mbox h2{font-weight:900;font-style:italic;font-size:28px;line-height:1.05;margin:0 0 8px}
  .mbox p{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 16px}
  .mbox .yes,.mbox .no{display:block;width:100%;border:0;border-radius:999px;padding:14px;font:700 16px var(--f);cursor:pointer;margin-top:8px}
  .mbox .yes{background:var(--red);color:#fff}
  .mbox .no{background:var(--card2);color:var(--text)}

  /* video */
  .vgp{font-size:14px;color:var(--muted);margin:18px 2px 8px;font-weight:600}
  .vgp:first-child{margin-top:4px}
  .vcard{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:14px}
  .vthumb{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;background:#000 center/cover no-repeat;cursor:pointer}
  .vthumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55))}
  .vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;z-index:1;box-shadow:0 6px 20px rgba(0,0,0,.45)}
  .vplay:before{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
  .vframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
  .vbody{padding:12px 16px 14px}
  .vbody h3{margin:0 0 4px;font-size:17px;line-height:1.3;font-weight:700}
  .vbody .meta{margin:0}
  .vbody a{color:var(--red2);text-decoration:none;font-weight:600}
  .vcard.spoil .vthumb,.vcard.spoil h3{filter:blur(9px);pointer-events:none;user-select:none}

  .toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14.5px;font-weight:600;opacity:0;transition:.25s;z-index:60;max-width:90vw;text-align:center;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  body[data-view=results] .hero,body[data-view=video] .hero,body[data-view=drivers] .hero,body[data-view=cal] .hero,body[data-view=sfida] .hero{display:none}
  body.f2 .f1only,body.wec .f1only{display:none}
  /* compagni di squadra */
  .h2h{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:10px}
  .h2h .tm{font-size:14px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .h2h .tm i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .h2h .names{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin-bottom:8px}
  .h2h .names span:last-child{text-align:right}
  .h2h .ln{display:grid;grid-template-columns:28px 1fr 78px 1fr 28px;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:6px 0}
  .h2h .ln b{font-size:18px;color:var(--text);text-align:center}
  .h2h .ln .lbl{text-align:center}
  .h2h .tr{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;display:flex}
  .h2h .tr.l{justify-content:flex-end}
  .h2h .tr i{display:block;height:100%;border-radius:4px}
  .h2h .ex{font-size:12.5px;color:var(--faint);margin-top:6px}
  /* sfida */
  .dhead{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
  .dhead:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:repeating-linear-gradient(90deg,var(--red) 0 14px,#f1eee8 14px 28px)}
  .dhead h3{font-weight:900;font-style:italic;font-size:28px;line-height:1;margin:6px 0 6px}
  .dhead p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}
  .score{display:flex;gap:10px;margin-top:14px}
  .score div{flex:1;background:var(--card2);border-radius:14px;padding:10px 12px}
  .score div.lead{background:linear-gradient(180deg,rgba(242,193,78,.22),var(--card2))}
  .score small{display:block;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .score b{font-size:30px;font-weight:900;font-style:italic;line-height:1.1}
  .duel{background:var(--card);border-radius:18px;padding:10px;margin-bottom:8px}
  .duel .tm{font-size:13px;color:var(--muted);font-weight:600;padding:0 4px 6px;display:flex;align-items:center;gap:6px}
  .duel .tm i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .duel .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .duel button{position:relative;border:2px solid transparent;background:var(--card2);color:var(--text);border-radius:14px;padding:12px 10px 10px;font:700 15.5px var(--f);text-align:left;cursor:pointer;min-height:58px}
  .duel button small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
  .duel button.mine{border-color:var(--red);background:var(--tint)}
  .duel button.win{box-shadow:inset 0 0 0 2px var(--gold)}
  .duel button:disabled{cursor:default}
  .duel .rv{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#8f7bff;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .duel .ok{position:absolute;bottom:8px;right:10px;font-size:15px}
  .dact{display:flex;gap:8px;margin:14px 0 6px}
  .dact button{flex:1;border:0;border-radius:999px;padding:13px;font:700 15px var(--f);cursor:pointer}
  .dact .wa{background:#25d366;color:#08311a}
  .dact .sec{background:var(--card2);color:var(--text);flex:0 0 auto;padding:13px 16px}
  .dnote{font-size:13px;color:var(--muted);line-height:1.5;margin:6px 2px 14px}
  .nameset{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
  .nameset label{display:block;font-weight:700;margin-bottom:8px}
  .nameset input{width:100%;font:600 17px var(--f);padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text)}
  .nameset button{margin-top:10px;width:100%;border:0;border-radius:999px;padding:12px;font:700 15px var(--f);background:var(--red);color:#fff;cursor:pointer}
  .hist{background:var(--card);border-radius:20px;overflow:hidden;margin-top:12px}
  .hist .row{padding:10px 16px}
  .promo{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin:0 0 14px;cursor:pointer;border:1px solid var(--line)}
  .promo .fl{font-size:24px}
  .promo b{display:block;font-size:15.5px}
  .promo small{color:var(--muted);font-size:13px}
  .promo .go{margin-left:auto;color:var(--red2);font-weight:700;font-size:20px}
  footer{color:var(--faint);font-size:12.5px;text-align:center;margin-top:28px;line-height:1.5}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <label class="serie"><span class="logo"><b id="serLogo">F1</b>News<span>/</span> <i aria-hidden="true">▾</i></span><select id="serSel" aria-label="Campionato"><option value="f1">Formula 1</option><option value="f2">Formula 2</option><option value="wec">WEC Hypercar</option></select></label>
    <div class="hright">
      <div class="stamp" id="stamp"></div>
      <button class="refresh" id="refreshBtn" aria-label="Aggiorna ora"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    </div>
  </header>

  <section class="hero" id="hero" hidden>
    <div class="lbl">Prossimo Gran Premio</div>
    <div class="gp" id="gpName"></div>
    <div class="when" id="gpWhen"></div>
    <div class="lights" id="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="cd" id="cd"></div>
  </section>

  <nav class="tabs" id="tabs" aria-label="Sezioni">
    <button data-v="news" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a2 2 0 0 1 2 2v13a1 1 0 0 0 2 0V8"/><path d="M5 4a1 1 0 0 0-1 1v13a2 2 0 0 0 2 2h14"/><path d="M8 8h6M8 12h6M8 16h4"/></svg>Notizie</button>
    <button data-v="sched"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Orari</button>
    <button data-v="results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h13l-2.5 4L18 12H5"/></svg>Risultati</button>
    <button data-v="video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/></svg>Video</button>
    <button data-v="drivers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h10"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 6h3a3 3 0 0 1-3 4M7 6H4a3 3 0 0 0 3 4"/></svg>Classifica</button>
    <button data-v="sfida" class="f1only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h4v4H5zM9 8h4v4H9zM13 4h4v4h-4zM13 12h4v4h-4zM5 12h4v4H5zM17 8h2v4h-2" fill="currentColor" stroke="none"/><path d="M5 4h14v12H5"/></svg>Sfida</button>
    <button data-v="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendario</button>
  </nav>

  <section id="v-news">
    <div id="duelPromo"></div>
    <div class="pages" id="pages"></div>
    <nav class="chips" id="chips"></nav>
    <main id="list">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </main>
  </section>
  <section id="v-sched" hidden><div id="sched"></div></section>
  <section id="v-results" hidden><div id="results"></div></section>
  <section id="v-video" hidden><div id="videos"></div></section>
  <section id="v-sfida" hidden>
    <div id="duel"></div>
  </section>
  <section id="v-drivers" hidden>
    <div class="seg" id="segStand"><button data-s="drivers" class="on">Piloti</button><button data-s="teams">Scuderie</button><button data-s="h2h" class="f1only">Compagni</button></div>
    <div class="table" id="drivers"></div>
    <div class="table" id="teams" hidden></div>
    <div id="h2h" hidden></div>
  </section>
  <section id="v-cal" hidden><div id="cal"></div></section>
  <div class="modal" id="spModal" hidden>
    <div class="mbox">
      <div class="ico">🙈</div>
      <h2 id="spQ"></h2>
      <p id="spP"></p>
      <button class="yes" id="spYes">Sì, l'ho già vista</button>
      <button class="no" id="spNo">No, niente spoiler</button>
    </div>
  </div>
  <footer>Notizie raccolte e riassunte da Claude dalle principali testate di motorsport.<br>Tocca una notizia per aprire l'articolo originale.</footer>
</div>

<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let news = [], info = null, filter = "Tutte", cdTimer = null;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rel(iso){
  const d=new Date(iso), m=(Date.now()-d)/60000;
  if(isNaN(d)) return "";
  if(m<60) return Math.max(1,Math.round(m))+" min fa";
  if(m<1440) return Math.round(m/60)+" h fa";
  return d.toLocaleDateString("it-IT",{day:"numeric",month:"short"});
}
function dayLabel(iso){
  const d=new Date(iso), t=new Date(); t.setHours(0,0,0,0);
  const x=new Date(d); x.setHours(0,0,0,0);
  const diff=(t-x)/86400000;
  if(diff===0) return "Oggi";
  if(diff===1) return "Ieri";
  return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
}

function renderChips(){
  const tags=["Tutte",...new Set(news.map(n=>n.tag).filter(Boolean))];
  $("#chips").innerHTML=tags.map(t=>`<button class="chip${t===filter?" on":""}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.t;try{localStorage.setItem("f1f",filter)}catch(e){};render()});
}

/* ---------- Le mie pagine ---------- */
const DEFAULT_PAGES=[
  {name:"MemasGP",url:"https://www.facebook.com/search/top?q=MemasGP",color:"#e10600"},
  {name:"Hammer Time",url:"https://www.facebook.com/search/top?q=Hammer%20Time%20F1",color:"#7a5cff"}
];
function renderPages(list){
  if(series!=="f1"){$("#pages").innerHTML="";return}
  const pages=(list&&list.length?list:DEFAULT_PAGES).filter(p=>/^https?:\/\//.test(p.url||""));
  $("#pages").innerHTML=`<h4>Le mie pagine</h4><div class="row2">`+pages.map(p=>{
    const ini=p.name.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
    return `<a class="pg" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="av" style="background:${esc(p.color||"#333")}">${esc(ini)}</div><div><b>${esc(p.name)}</b><small>Facebook ›</small></div></a>`;
  }).join("")+`</div>`;
}

/* ---------- Anti-spoiler ---------- */
let spoilerHidden=false, askedFor=null;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function spoilerSession(){
  // sessione chiave (qualifiche/sprint/gara) iniziata da meno di 36 ore e non ancora superata da quella dopo
  const ses=(weekend?.sessions||[]).filter(s=>s.key).sort((a,b)=>new Date(a.start)-new Date(b.start));
  const now=Date.now(); let cur=null;
  for(const s of ses){ const st=new Date(s.start).getTime(); if(st<=now && now<st+36*3600e3) cur=s; }
  return cur;
}
const sKey=s=>"f1seen:"+series+":"+s.start;
const sLabel=s=>{const n=s.name.toLowerCase();return n.startsWith("gara")?"la gara":n.includes("feature")?"la Feature Race":n.includes("sprint")&&!n.includes("qualif")?"la Sprint":n.includes("qualif")&&n.includes("sprint")?"le qualifiche Sprint":"le qualifiche"};
function checkSpoiler(){
  const s=spoilerSession();
  if(!s||lsGet(sKey(s))==="1"){spoilerHidden=false;$("#spModal").hidden=true;return}
  if(askedFor===sKey(s)) return;               // già chiesto in questa apertura
  askedFor=sKey(s);
  const lbl=sLabel(s);
  $("#spQ").textContent=`Hai già visto ${lbl}?`;
  const tv=s.tv8?` Su TV8 va in ${s.tv8.live?"diretta":"differita"} alle ${hm(s.tv8.time)}.`:"";
  const sing=lbl.startsWith("la ");
  $("#spP").textContent=`${weekend.gp}: ${lbl} ${sing?"è iniziata":"sono iniziate"} alle ${hm(s.start)}.${tv} Se non ${sing?"l'hai vista":"le hai viste"}, nascondo le notizie che potrebbero rovinarti la sorpresa.`;
  $("#spModal").hidden=false;
  $("#spYes").onclick=()=>{lsSet(sKey(s),"1");spoilerHidden=false;$("#spModal").hidden=true;render();renderStandings();renderResults();renderVideos();renderDuel()};
  $("#spNo").onclick=()=>{spoilerHidden=true;$("#spModal").hidden=true;render();renderStandings();renderResults();renderVideos();renderDuel()};
}
function isSpoiler(n){
  if(!spoilerHidden) return false;
  const s=spoilerSession(); if(!s) return false;
  return new Date(n.published).getTime()>=new Date(s.start).getTime()-30*60e3;
}
function spoilerBanner(){
  const s=spoilerSession(); if(!spoilerHidden||!s) return "";
  return `<div class="sbanner"><span>🙈 Notizie ${esc(sLabel(s).replace(/^la /,"sulla ").replace(/^le /,"sulle "))} nascoste per evitare spoiler</span><button onclick="revealSpoiler()">Ora l'ho visto</button></div>`;
}
function revealSpoiler(){const s=spoilerSession();if(s)lsSet(sKey(s),"1");spoilerHidden=false;render();renderStandings();renderResults();renderVideos();renderDuel()}

function render(){
  renderChips();
  const items=news.filter(n=>filter==="Tutte"||n.tag===filter);
  if(!items.length){$("#list").innerHTML=`<div class="empty">Nessuna notizia ancora.<br>Il prossimo aggiornamento arriverà a breve.</div>`;return}
  let html=spoilerBanner(), last="";
  items.forEach((n,i)=>{
    const dl=dayLabel(n.published);
    if(dl!==last){html+=`<div class="day">${esc(dl)}</div>`;last=dl}
    const href=/^https?:\/\//.test(n.url||"")?n.url:"#";
    html+=`<a class="card${n.top?" top":""}${isSpoiler(n)?" spoil":""}" href="${esc(href)}" target="_blank" rel="noopener">
      <div class="meta">${n.tag?`<span class="tag">${esc(n.tag)}</span>`:""}<span>${esc(rel(n.published))}</span></div>
      <h3>${esc(n.title)}</h3>
      ${n.summary?`<p>${esc(n.summary)}</p>`:""}
      ${n.source?`<div class="src">${esc(n.source)} ›</div>`:""}
    </a>`;
  });
  $("#list").innerHTML=html;
}

function renderInfo(){
  $("#stamp").textContent=info?.updated?"Agg. "+rel(info.updated):"";
  $("#hero .lbl").textContent=S().next;
  clearInterval(cdTimer);
  if(!info?.nextGp?.date){$("#hero").hidden=true;return}
  $("#hero").hidden=false;
  const n=info.nextGp;
  $("#gpName").textContent=n.name;
  const d=new Date(n.date);
  const when=n.dateOnly?d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",timeZone:"Europe/Rome"})
    :d.toLocaleString("it-IT",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Rome"});
  $("#gpWhen").textContent=(n.circuit?n.circuit+" · ":"")+(n.label||"Gara")+" "+when+(n.note?" · "+n.note:"");
  const tick=()=>{
    let s=Math.max(0,(d-Date.now())/1000);
    const g=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
    const L=$("#lights"), lit=s<=0?0:Math.max(0,Math.min(5,6-Math.ceil(s/86400)));
    L.classList.toggle("go",s<=0);
    L.querySelectorAll("i").forEach((x,i)=>x.classList.toggle("on",i<lit));
    const pl=(n,a,b)=>n+" "+(n===1?a:b);
    $("#cd").innerHTML=s<=0?`<b>Semaforo verde: si corre!</b>`:
      n.dateOnly?`Mancano <b>${pl(Math.ceil(s/86400),"giorno","giorni")}</b>`:
      g>0?`Mancano <b>${pl(g,"giorno","giorni")}</b> e <b>${pl(h,"ora","ore")}</b>`:
      `Mancano <b>${pl(h,"ora","ore")}</b> e <b>${m} min</b>`;
  };
  tick(); cdTimer=setInterval(tick,30000);
}

const TEAM_COLORS={mercedes:"#27f4d2",ferrari:"#e8002d","red bull":"#3671c6",mclaren:"#ff8000","racing bulls":"#6692ff",alpine:"#ff87bc",haas:"#b6babd",audi:"#bb0a30",williams:"#64c4ff","aston martin":"#229971",cadillac:"#c9a227",campos:"#ffb300",invicta:"#8e5cf0",rodin:"#9aa0a6","mp motorsport":"#ff6d00",dams:"#1e88e5","art grand prix":"#e8e8e8",trident:"#5c6bc0",hitech:"#26a69a","van amersfoort":"#f06292",prema:"#e53935",aix:"#a1887f",toyota:"#eb0a1e",bmw:"#1c69d4",porsche:"#c9c9c9",peugeot:"#9be15d",genesis:"#a78bfa"};
function teamColor(t){t=String(t||"").toLowerCase();for(const k in TEAM_COLORS)if(t.includes(k))return TEAM_COLORS[k];return "#666"}
let standings=null;
function renderStandings(){
  const s=standings;
  if(!s){["#drivers","#teams"].forEach(id=>$(id).innerHTML=`<div class="empty">Classifica non ancora disponibile.</div>`);return}
  const sub=`<div class="sub">Classifica ${esc(s.after||"")}${s.updated?" · aggiornata "+esc(rel(s.updated)):""}</div>`;
  const lead=(s.drivers||[])[0]?.points||0;
  $("#drivers").innerHTML=sub+(s.drivers||[]).map(d=>`<div class="row p${d.pos}">
    <div class="pos">${esc(d.pos)}</div><div class="bar" style="background:${teamColor(d.team)}"></div>
    <div class="who"><b>${esc(d.name)}${d.champion?'<span class="champ">Campione</span>':""}</b><small>${esc(d.team)}</small></div>
    <div class="pts">${esc(d.points)}${d.pos>1?`<small>-${lead-d.points}</small>`:"<small>pt</small>"}</div></div>`).join("");
  const tl=(s.constructors||[])[0]?.points||0;
  $("#teams").innerHTML=sub+(s.constructors||[]).map(c=>`<div class="row p${c.pos}">
    <div class="pos">${esc(c.pos)}</div><div class="bar" style="background:${teamColor(c.team)}"></div>
    <div class="who"><b>${esc(c.team)}${c.champion?'<span class="champ">Campione</span>':""}</b>${c.drivers?`<small>${esc(c.drivers)}</small>`:""}</div>
    <div class="pts">${esc(c.points)}${c.pos>1?`<small>-${tl-c.points}</small>`:"<small>pt</small>"}</div></div>`).join("");
  // classifiche nascoste se aggiornate dopo l'inizio della sessione non ancora vista
  const sp=spoilerSession(), hide=spoilerHidden&&sp&&s.updated&&new Date(s.updated)>=new Date(sp.start);
  ["#drivers","#teams"].forEach(id=>{$(id).classList.toggle("spoil",!!hide);
    if(hide)$(id).insertAdjacentHTML("afterbegin",spoilerBanner())});
}
let weekend=null;
const hm=iso=>new Date(iso).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Rome"});
const dayName=iso=>new Date(iso).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",timeZone:"Europe/Rome"});
function renderSched(){
  const w=weekend, el=$("#sched");
  if(!w||!w.sessions?.length){el.innerHTML=`<div class="empty">Orari del prossimo weekend non ancora disponibili.</div>`;return}
  const now=Date.now();
  const ses=[...w.sessions].sort((a,b)=>new Date(a.start)-new Date(b.start));
  const nextIdx=ses.findIndex(s=>new Date(s.end||s.start).getTime()>now);
  const tv=ses.filter(s=>s.tv8);
  let h="";
  if(tv.length){
    h+=`<div class="tv8"><h4>📺 In chiaro su TV8</h4>`+tv.map(s=>`<div class="l"><span>${esc(s.name)} · ${esc(dayName(s.tv8.time).split(" ")[0])}</span><b>${esc(hm(s.tv8.time))}</b></div>`).join("")+
      `<div class="note">${tv.every(s=>s.tv8.live)?"In diretta":tv.some(s=>s.tv8.live)?"Alcune sessioni in diretta, altre in differita":"In differita"} · anche in streaming gratis su tv8.it</div></div>`;
  } else if(w.tv8note){
    h+=`<div class="tv8"><h4>📺 TV8</h4><div class="note" style="margin:0">${esc(w.tv8note)}</div></div>`;
  }
  h+=`<div class="table"><div class="sub">${esc(w.gp||"")}${w.circuit?" · "+esc(w.circuit):""} · orari italiani</div>`;
  let last="";
  ses.forEach((s,i)=>{
    const d=dayName(s.start); if(d!==last){h+=`<div class="dayh">${esc(d)}</div>`;last=d}
    const st=new Date(s.start).getTime(), en=new Date(s.end||s.start).getTime()+(s.end?0:2*3600e3);
    const live=now>=st&&now<en, done=now>=en;
    const badge=live?`<span class="badge live">In corso</span>`:i===nextIdx?`<span class="badge next">Prossima</span>`:"";
    const tv8=s.tv8?`<br><span class="p8">TV8 ${s.tv8.live?"diretta":"differita"} ore ${esc(hm(s.tv8.time))}</span>`:"";
    h+=`<div class="sess${s.key?" key":""}${done?" done":""}"><div class="t">${esc(hm(s.start))}${s.end?`<small>– ${esc(hm(s.end))}</small>`:""}</div>
      <div class="n"><b>${esc(s.name)}${badge}</b><div class="ch">${esc(s.live||"")}${tv8}</div></div></div>`;
  });
  el.innerHTML=h+`</div>`;
}
/* ---------- Risultati ---------- */
let results=null, resMode=0, calendar=null;
function resTabs(r){
  if(Array.isArray(r.tabs)&&r.tabs.length) return r.tabs;
  const t=[];
  if((r.race||[]).length) t.push({label:"Gara",kind:"race",rows:r.race});
  if((r.sprint||[]).length) t.push({label:"Sprint",kind:"race",rows:r.sprint});
  if((r.quali||[]).length) t.push({label:"Qualifiche",kind:"quali",rows:r.quali});
  return t;
}
function renderResults(){
  const r=results, el=$("#results");
  if(!r){el.innerHTML=`<div class="empty">Risultati non ancora disponibili.</div>`;return}
  const sp=spoilerSession();
  const hide=spoilerHidden&&sp&&r.updated&&new Date(r.updated)>=new Date(sp.start)-30*60e3;
  const tabs=resTabs(r); if(resMode>=tabs.length) resMode=0;
  const first=tabs.find(t=>t.kind!=="quali");
  const pod=(r.podium||first?.rows||[]).slice(0,3);
  let h=`<div class="spoilwrap${hide?" spoil":""}">${hide?spoilerBanner():""}
    <div class="rhead"><div class="lbl">${S().last}${r.round?" · Round "+esc(r.round):""}</div><h3>${esc(r.gp)}</h3>
    ${pod.length===3?`<div class="podium">${[1,0,2].map(i=>`<div><b>${["🥇","🥈","🥉"][i]}</b><span>${esc(String(pod[i].name).split(" ").slice(-1)[0])}</span></div>`).join("")}</div>${first&&!r.podium?`<div style="font-size:11.5px;color:var(--muted);margin-top:6px">Podio: ${esc(first.label)}</div>`:""}`:""}
    ${r.summary?`<p style="margin-top:10px">${esc(r.summary)}</p>`:""}</div>
    <div class="seg" id="segRes" style="overflow-x:auto">${tabs.map((t,i)=>`<button data-i="${i}" class="${i===resMode?"on":""}" style="white-space:nowrap">${esc(t.label)}</button>`).join("")}</div>
    <div class="table">`;
  const t=tabs[resMode]||{rows:[]}, isQ=t.kind==="quali";
  h+=(t.rows||[]).map(d=>`<div class="row p${esc(d.pos)}">
    <div class="pos">${esc(d.pos)}</div><div class="bar" style="background:${teamColor(d.team)}"></div>
    <div class="who"><b>${esc(d.name)}${d.note?`<span class="note">${esc(d.note)}</span>`:""}</b><small>${esc(d.team)}</small></div>
    <div class="pts" style="font-size:15px;font-family:Inter;font-weight:500">${esc(isQ?d.time:d.gap||"")}${!isQ&&d.points?`<small>+${esc(d.points)} pt</small>`:""}</div></div>`).join("");
  el.innerHTML=h+`</div></div>`;
  el.querySelectorAll("#segRes button").forEach(b=>b.onclick=()=>{resMode=+b.dataset.i;renderResults()});
}

/* ---------- Video ---------- */
let videos=[];
const ytId=v=>/^[\w-]{11}$/.test(v?.youtube||"")?v.youtube:null;
function videoSpoiler(v){
  if(!spoilerHidden) return false;
  const s=spoilerSession(); if(!s) return false;
  return new Date(v.published).getTime()>=new Date(s.start).getTime()-30*60e3;
}
function renderVideos(){
  const el=$("#videos"); if(!el) return;
  const list=videos.filter(ytId).sort((a,b)=>String(b.published).localeCompare(String(a.published)));
  if(!list.length){el.innerHTML=`<div class="empty">Nessun video ancora.<br>Gli highlights di qualifiche e gara arrivano poche ore dopo la fine della sessione.</div>`;return}
  let h=list.some(videoSpoiler)?spoilerBanner():"", last=null;
  list.forEach(v=>{
    const id=ytId(v), gp=v.gp||"";
    if(gp!==last){h+=`<div class="vgp">${esc(gp)}</div>`;last=gp}
    h+=`<div class="vcard${videoSpoiler(v)?" spoil":""}">
      <button class="vthumb" data-yt="${esc(id)}" aria-label="Guarda: ${esc(v.title)}" style="background-image:url('https://i.ytimg.com/vi/${esc(id)}/hqdefault.jpg')"><span class="vplay"></span></button>
      <div class="vbody"><h3>${esc(v.title)}</h3>
      <div class="meta">${v.session?`<span class="tag">${esc(v.session)}</span>`:""}<span>${esc(rel(v.published))}</span>${v.channel?`<span>· ${esc(v.channel)}</span>`:""}<span>· <a href="https://www.youtube.com/watch?v=${esc(id)}" target="_blank" rel="noopener">Apri su YouTube ›</a></span></div></div>
    </div>`;
  });
  el.innerHTML=h;
  el.querySelectorAll(".vthumb").forEach(b=>b.onclick=()=>playVideo(b.dataset.yt));
}
function playVideo(id){
  renderVideos();   // ferma un eventuale video già in riproduzione
  const b=$("#videos").querySelector(`.vthumb[data-yt="${id}"]`); if(!b) return;
  const f=document.createElement("iframe");
  f.className="vframe"; f.title="Video";
  f.src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0`;
  f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen=true;
  b.replaceWith(f);
}

/* ---------- Calendario ---------- */
function renderCal(){
  const c=calendar, el=$("#cal");
  if(!c?.rounds?.length){el.innerHTML=`<div class="empty">Calendario non disponibile.</div>`;return}
  const today=new Date().toISOString().slice(0,10);
  const canc=x=>/^annullat/i.test(x.status||"");
  const nextR=c.rounds.find(x=>!x.winner&&!canc(x)&&x.date>=today);
  const done=c.rounds.filter(x=>x.winner).length;
  const wins={}; c.rounds.forEach(x=>{(x.wins||(x.winner?[x.winner]:[])).forEach(w=>wins[w]=(wins[w]||0)+1)});
  const top=Object.entries(wins).sort((a,b)=>b[1]-a[1]);
  let h=`<div class="rhead"><div class="lbl">Stagione ${esc(c.season)}</div><h3>${done} ${S().unit} ${series==="wec"?"corse":"corsi"} su ${c.rounds.filter(x=>!canc(x)).length}</h3>
    <p>${S().wins}: ${top.map(([n,w])=>`${esc(n.split(" ").slice(-1)[0])} <b>${w}</b>`).join(" · ")}</p></div><div class="table cal">`;
  h+=c.rounds.map(x=>{
    const d=new Date(x.date+"T12:00:00Z");
    const ds=d.toLocaleDateString("it-IT",{day:"numeric",month:"short"});
    const isNext=nextR&&x.round===nextR.round;
    return `<div class="row${x.winner?" done":""}${isNext?" next":""}">
      <div class="rnd">${esc(x.round)}</div><div class="bar" style="background:${x.winner?teamColor(x.team):"#333"}"></div>
      <div class="who"><b>${esc(x.name)}${isNext?'<span class="badge next">Prossimo</span>':""}</b>
      <div class="win">${x.winner?`<i>🏆</i> ${esc(x.winner)}${x.team?" · "+esc(x.team):""}`:esc(x.circuit||"")}${x.sprintWinner?`<br>Sprint: ${esc(x.sprintWinner)}`:""}${x.status?`<br><span style="color:#ffb74d">${esc(x.status)}</span>`:""}</div></div>
      <div class="dt"><b>${esc(ds)}</b>${x.sprint?"Sprint":""}</div></div>`;
  }).join("");
  el.innerHTML=h+`</div>`;
}

/* ---------- Compagni di squadra ---------- */
let h2h=null, duels=null;
function renderH2H(){
  const el=$("#h2h"); if(!el) return;
  if(!h2h?.pairs?.length){el.innerHTML=`<div class="empty">Confronti non ancora disponibili.</div>`;return}
  const line=(lab,x,y,c)=>{const t=(x+y)||1;return `<div class="ln"><b>${x}</b><div class="tr l"><i style="width:${x/t*100}%;background:${c}"></i></div><span class="lbl">${lab}</span><div class="tr"><i style="width:${y/t*100}%;background:${c};opacity:.45"></i></div><b>${y}</b></div>`};
  el.innerHTML=`<div class="sub" style="padding:0 2px 10px">Chi è stato davanti tra compagni di squadra, ${esc(h2h.after||"")}</div>`+h2h.pairs.map(p=>{
    const c=teamColor(p.team);
    return `<div class="h2h"><div class="tm"><i style="background:${c}"></i>${esc(p.team)}</div>
      <div class="names"><span>${esc(p.a)}</span><span>${esc(p.b)}</span></div>
      ${line("Qualifica",p.quali[0],p.quali[1],c)}${line("Gara",p.race[0],p.race[1],c)}
      ${p.extra?`<div class="ex">${esc(p.extra)}</div>`:""}</div>`}).join("");
}

/* ---------- Sfida pronostici ---------- */
const DKEY="f1duel";
function dGet(){try{return JSON.parse(localStorage.getItem(DKEY))||{}}catch(e){return {}}}
function dSet(o){try{localStorage.setItem(DKEY,JSON.stringify(o))}catch(e){}}
const short=n=>String(n||"").split(" ").slice(-1)[0];
function curRound(){const r=duels?.rounds||[];return r.find(x=>!x.outcome)||r[r.length-1]||null}
function isLocked(rd){return rd&&rd.lock&&Date.now()>=new Date(rd.lock).getTime()}
function scoreOf(picks){let pts=0,played=0;(duels?.rounds||[]).forEach(rd=>{if(!rd.outcome)return;const pk=picks?.[rd.round]||{};Object.keys(rd.outcome).forEach(id=>{const o=rd.outcome[id];if(o!=="a"&&o!=="b")return;if(pk[id]){played++;if(pk[id]===o)pts++}})});return {pts,played}}
function duelSpoiler(rd){
  if(!spoilerHidden||!rd?.outcome) return false;
  const sp=spoilerSession(); return !!sp;
}
function renderDuelPromo(){
  const el=$("#duelPromo"); if(!el) return;
  const rd=curRound(); const st=dGet();
  if(series!=="f1"||!rd||rd.outcome||isLocked(rd)){el.innerHTML="";return}
  const mine=st.me?.picks?.[rd.round]||{}, done=rd.pairs.filter(p=>mine[p.id]).length;
  if(done===rd.pairs.length){el.innerHTML="";return}
  el.innerHTML=`<div class="promo" onclick="openDuel()"><span class="fl">🏁</span><div><b>Sfida ${esc(rd.gp)}</b><small>${done?`Hai scelto ${done} duelli su ${rd.pairs.length}`:"Scegli chi arriva davanti in ogni squadra"}</small></div><span class="go">›</span></div>`;
}
function openDuel(){showView("sfida");scrollTo({top:0})}
function renderDuel(){
  const el=$("#duel"); if(!el) return; renderDuelPromo();
  if(!duels?.rounds?.length){el.innerHTML=`<div class="empty">La sfida si apre prima del prossimo GP.</div>`;return}
  const st=dGet();
  if(!st.me?.name){
    el.innerHTML=`<div class="dhead"><h3>Sfida tra fratelli</h3><p>Prima di ogni GP scegli, squadra per squadra, quale dei due compagni arriva davanti in gara. Ogni scelta giusta vale un punto. Le scelte si chiudono all'inizio delle qualifiche.</p></div>
    <form class="nameset" onsubmit="event.preventDefault();saveName()"><label for="dname">Come ti chiami?</label><input id="dname" maxlength="20" autocomplete="nickname" placeholder="Il tuo nome"><button type="submit">Inizia la sfida</button></form>`;
    return;
  }
  const rd=curRound(), locked=isLocked(rd), hide=duelSpoiler(rd);
  const mine=st.me.picks?.[rd.round]||{};
  const rivals=Object.entries(st.rivals||{});
  const players=[[st.me.name,st.me.picks,true],...rivals.map(([n,v])=>[n,v.picks,false])];
  const sc=players.map(([n,p,me])=>({n,me,...scoreOf(p)}));
  const top=Math.max(...sc.map(x=>x.pts));
  const lockTxt=rd.lock?new Date(rd.lock).toLocaleString("it-IT",{weekday:"long",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Rome"}):"";
  let h=`<div class="dhead"><p>${rd.outcome?"Risultati della sfida":locked?"Scelte chiuse":"Sfida aperta"} · Round ${esc(rd.round)}</p><h3>${esc(rd.gp)}</h3>
    <p>${rd.outcome?(hide?"Esiti nascosti per evitare spoiler.":"Ecco com'è andata."):locked?"Le qualifiche sono iniziate: si aspetta la gara.":`Scegli chi arriva davanti in gara. Puoi cambiare idea fino a ${esc(lockTxt)}.`}</p>
    <div class="score">${sc.map(x=>`<div class="${!hide&&x.pts===top&&top>0?"lead":""}"><small>${esc(x.me?x.n+" (tu)":x.n)}</small><b>${hide?"–":x.pts}</b><small>${hide?"":"punti in stagione"}</small></div>`).join("")}${rivals.length?"":`<div><small>Tuo fratello</small><b>–</b><small>non ha ancora inviato</small></div>`}</div></div>`;
  h+=rd.pairs.map(p=>{
    const c=teamColor(p.team), o=hide?null:rd.outcome?.[p.id];
    const btn=k=>{const nm=p[k];const rv=rivals.filter(([n,v])=>v.picks?.[rd.round]?.[p.id]===k).map(([n])=>n);
      const showRv=locked||rd.outcome; // le scelte del fratello si vedono dopo la chiusura
      return `<button data-p="${esc(p.id)}" data-k="${k}" class="${mine[p.id]===k?"mine":""} ${o===k?"win":""}" ${locked?"disabled":""}>${esc(short(nm))}<small>${esc(nm.split(" ").slice(0,-1).join(" ")||"")}</small>${showRv?rv.map(n=>`<span class="rv" title="${esc(n)}">${esc(n[0].toUpperCase())}</span>`).join(""):""}${o&&mine[p.id]===k?`<span class="ok">${o===k?"✅":"❌"}</span>`:""}</button>`};
    return `<div class="duel"><div class="tm"><i style="background:${c}"></i>${esc(p.team)}${o==="x"?" · annullato":""}</div><div class="opts">${btn("a")}${btn("b")}</div></div>`;
  }).join("");
  const n=rd.pairs.filter(p=>mine[p.id]).length;
  h+=`<div class="dact"><button class="wa" onclick="shareDuel()">Invia a mio fratello su WhatsApp</button></div>
    <div class="dnote">${locked?"":`Hai scelto ${n} duelli su ${rd.pairs.length}. `}Quando invii, tuo fratello apre il link e le tue scelte entrano nella sua app; lui fa lo stesso con te. Le sue scelte compaiono qui (pallino viola) dopo la chiusura.</div>`;
  const past=(duels.rounds||[]).filter(x=>x.outcome);
  if(past.length&&!hide){
    h+=`<div class="hist"><div class="sub">Gran Premi giocati</div>`+past.slice().reverse().map(x=>{
      const pts=players.map(([nm,pk])=>{let v=0;const q=pk?.[x.round]||{};Object.keys(x.outcome).forEach(id=>{if(q[id]&&q[id]===x.outcome[id])v++});return `${esc(nm)} ${v}`}).join(" · ");
      return `<div class="row"><div class="who"><b>${esc(x.gp)}</b><small>${pts}</small></div></div>`}).join("")+`</div>`;
  }
  h+=`<div class="dnote" style="text-align:center;margin-top:16px"><button class="btn" onclick="renameDuel()">Cambia nome</button></div>`;
  el.innerHTML=h;
  el.querySelectorAll(".duel button[data-p]").forEach(b=>b.onclick=()=>{
    if(locked) return;
    const s2=dGet(); s2.me.picks=s2.me.picks||{}; const r=s2.me.picks[rd.round]=s2.me.picks[rd.round]||{};
    r[b.dataset.p]=b.dataset.k; dSet(s2); renderDuel();
  });
}
function saveName(){const v=($("#dname").value||"").trim();if(!v){$("#dname").focus();return}const s2=dGet();s2.me={name:v,picks:s2.me?.picks||{}};dSet(s2);renderDuel()}
function renameDuel(){const s2=dGet();delete s2.me.name;dSet(s2);renderDuel();setTimeout(()=>{const i=$("#dname");if(i)i.value=""},0)}
function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function b64d(t){t=t.replace(/-/g,"+").replace(/_/g,"/");return JSON.parse(decodeURIComponent(escape(atob(t))))}
async function shareDuel(){
  const st=dGet(); if(!st.me?.name) return;
  const url=location.origin+location.pathname+"#sfida="+b64e({n:st.me.name,p:st.me.picks||{}});
  const rd=curRound();
  const text=`🏁 I miei pronostici per la sfida ${rd?rd.gp:""} su F1 News. Apri il link per caricarli nella tua app: ${url}`;
  if(navigator.share){try{await navigator.share({text});return}catch(e){if(e&&e.name==="AbortError")return}}
  location.href="https://wa.me/?text="+encodeURIComponent(text);
}
function importDuel(){
  const m=location.hash.match(/^#sfida=([\w-]+)/); if(!m) return false;
  try{
    const d=b64d(m[1]); const st=dGet();
    if(st.me?.name&&st.me.name.toLowerCase()===String(d.n).toLowerCase()){toast("Questo è il tuo link: invialo a tuo fratello")}
    else{st.rivals=st.rivals||{}; st.rivals[d.n]={picks:d.p||{},at:new Date().toISOString()}; dSet(st); toast("✓ Pronostici di "+d.n+" caricati")}
  }catch(e){toast("Link della sfida non valido")}
  history.replaceState(null,"",location.pathname);
  return true;
}
function segTo(k){
  document.querySelectorAll("#segStand button").forEach(x=>x.classList.toggle("on",x.dataset.s===k));
  ["drivers","teams","h2h"].forEach(id=>$("#"+id).hidden=id!==k);
  if(k==="h2h") renderH2H();
}

function showView(v){
  if(v==="teams") v="drivers";
  if(v==="sfida"&&series!=="f1") v="news";
  if(v==="sfida") renderDuel();
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  ["news","sched","results","video","drivers","cal","sfida"].forEach(k=>$("#v-"+k).hidden=k!==v);
  document.body.dataset.view=v;
  try{localStorage.setItem("f1v",v)}catch(e){}
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{showView(b.dataset.v);scrollTo({top:0,behavior:"smooth"})});

let series="f1";
try{const v=localStorage.getItem("f1series");series=(v==="f2"||v==="wec")?v:"f1"}catch(e){}
const SER={f1:{logo:"F1",title:"F1 News",next:"Prossimo Gran Premio",last:"Ultimo GP",unit:"GP",teams:"Scuderie",wins:"Vittorie"},f2:{logo:"F2",title:"F2 News",next:"Prossimo round",last:"Ultimo round",unit:"round",teams:"Scuderie",wins:"Vittorie Feature"},wec:{logo:"WEC",title:"WEC News",next:"Prossima gara",last:"Ultima gara",unit:"gare",teams:"Costruttori",wins:"Vittorie"}};
const S=()=>SER[series]||SER.f1;
function applySeriesUI(){
  document.body.classList.toggle("f2",series==="f2");
  document.body.classList.toggle("wec",series==="wec");
  $("#serLogo").textContent=S().logo;
  $("#serSel").value=series;
  document.title=S().title;
  const tb=document.querySelector('#segStand [data-s="teams"]'); if(tb) tb.textContent=S().teams;
}
let loadSeq=0, lastJson={};
let manual=false;
async function load(fresh){
  const my=++loadSeq, ser=series;
  try{
    const r=await fetch("data/"+ser+".json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const txt=await r.text();
    if(my!==loadSeq) return;
    if(!fresh && lastJson[ser]===txt) return "same";
    const changed=lastJson[ser]!==undefined&&lastJson[ser]!==txt;
    lastJson[ser]=txt;
    const d=JSON.parse(txt);
    news=(d.news||[]).slice().sort((a,b)=>String(b.published).localeCompare(String(a.published)));
    info=d.info||null; results=d.results||null; calendar=d.calendar||null; weekend=d.weekend||null; standings=d.standings||null; videos=Array.isArray(d.videos)?d.videos:[]; h2h=d.h2h||null; duels=d.duels||null;
    renderInfo(); renderResults(); renderCal(); renderStandings(); renderSched(); renderVideos(); renderPages(series==="f1"?d.pages?.list:null);
    checkSpoiler(); render(); renderStandings(); renderResults(); renderH2H(); renderDuel();
    return changed?"new":"same";
  }catch(e){
    if(my!==loadSeq) return;
    if(manual) return "err";
    if(!news.length) $("#list").innerHTML=`<div class="empty">Non riesco a caricare le notizie.<br>Controlla la connessione.<br><button class="btn" onclick="load(true)">Riprova</button></div>`;
  }
}
function switchSeries(v){
  series=["f2","wec"].includes(v)?v:"f1"; try{localStorage.setItem("f1series",series)}catch(e){}
  news=[];info=null;results=null;calendar=null;weekend=null;standings=null;videos=[];h2h=null;duels=null;filter="Tutte";resMode=0;spoilerHidden=false;askedFor=null;
  applySeriesUI(); if(series!=="f1"){segTo("drivers"); if(document.body.dataset.view==="sfida") showView("news")}
  $("#list").innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  renderInfo();renderStandings();renderSched();renderPages();renderResults();renderCal();renderChips();renderVideos();
  load(true); scrollTo({top:0});
}
$("#serSel").onchange=e=>switchSeries(e.target.value);
let toastT=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2800)}
$("#refreshBtn").onclick=async()=>{
  const b=$("#refreshBtn"); if(b.classList.contains("spin")) return;
  b.classList.add("spin"); manual=true;
  const before=info?.updated;
  let r; try{ r=await load(true); } finally { manual=false; setTimeout(()=>b.classList.remove("spin"),400); }
  if(r==="err") toast("Connessione assente, riprova tra poco");
  else if(r==="new"||info?.updated!==before) toast("✓ Dati aggiornati");
  else toast("Sei già aggiornato · ultimo aggiornamento "+(info?.updated?rel(info.updated):""));
};

(function(){
  try{showView(localStorage.getItem("f1v")||"news")}catch(e){}
  applySeriesUI();
  renderStandings(); renderSched(); renderPages(); renderResults(); renderCal();
  document.querySelectorAll("#segStand button").forEach(b=>b.onclick=()=>segTo(b.dataset.s));
  if(importDuel()){ if(series!=="f1"){series="f1";try{localStorage.setItem("f1series","f1")}catch(e){}applySeriesUI()} showView("sfida"); }
  load(true);
  setInterval(()=>{if(!document.hidden) load(false)},10*60e3);
  setInterval(()=>{if(weekend){renderSched();checkSpoiler()}},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){askedFor=null;load(false);if(weekend){checkSpoiler();render();renderStandings();renderResults();renderVideos();renderDuel()}}});
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
